services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: testmax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: testmax
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmax -d testmax"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://testmax:${POSTGRES_PASSWORD}@db:5432/testmax
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://testmax:${POSTGRES_PASSWORD}@db:5432/testmax
    healthcheck:
      disable: true

volumes:
  pgdata:
